# COMPLETE STACK: explicitly enables Linux host commands as root.
# NAS editor: replace the configuration of the existing meridian project.
# No second file, .env or numeric user configuration required.
# docker compose -f compose.host-root.yaml up -d
# Updates: docker compose -f compose.host-root.yaml pull && docker compose -f compose.host-root.yaml up -d

name: meridian

x-common: &common
  image: ghcr.io/exploid1/meridian:candidate
  pull_policy: always
  restart: unless-stopped
  environment: &env
    TZ: Europe/Berlin
    MERIDIAN_TIMEZONE: Europe/Berlin
  volumes:
    - meridian-data:/var/lib/meridian
    - meridian-secrets:/etc/meridian
  read_only: true
  tmpfs:
    - /tmp
    - /config/caddy:uid=1000,gid=1000
    - /data/caddy:uid=1000,gid=1000
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  host-bridge:
    image: ghcr.io/exploid1/meridian:host-candidate
    pull_policy: always
    container_name: meridian-host-bridge
    restart: unless-stopped
    user: "0:0"
    privileged: true
    pid: host
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      MERIDIAN_DOCKER_HOST_ENABLE: "1"
      MERIDIAN_HOST_UID: "0"
      MERIDIAN_HOST_GID: "0"
      MERIDIAN_HOST_ALLOW_ROOT: "1"
    volumes:
      - meridian-host-socket:/run/meridian-host
    tmpfs:
      - /tmp:size=16m,mode=0700
    stop_grace_period: 15s
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket = @stream_socket_client('unix:///run/meridian-host/default.sock', $$errno, $$error, 1); if ($$socket === false) { exit(1); } fclose($$socket);"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Der Updater erkennt die eingesetzte Compose-Datei über die Container-Metadaten.
  updater:
    image: ghcr.io/exploid1/meridian:updater-candidate
    container_name: meridian-updater
    restart: unless-stopped
    environment:
      MERIDIAN_UPDATE_MODE: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - meridian-data:/var/lib/meridian
      - meridian-updater-data:/var/lib/meridian-updater
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 256
    mem_limit: 512m

  web:
    <<: *common
    container_name: meridian-web
    environment:
      <<: *env
      FRANKENPHP_CONFIG: "num_threads 16"
      MERIDIAN_LIVE_STREAMS: "4"
      MERIDIAN_AUTO_SETUP: "1"
      MERIDIAN_ADMIN_USER: "admin"
      MERIDIAN_ADMIN_PASSWORD: "" # Existing accounts are preserved; fresh installs generate a password.
      MERIDIAN_ENV: ${MERIDIAN_ENV:-prod}
      MERIDIAN_TRUSTED_PROXIES: "172.19.0.0/16"
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    ports:
      - "${MERIDIAN_PORT:-8090}:8080"

  scheduler:
    <<: *common
    container_name: meridian-scheduler
    command: ["php", "bin/meridian", "scheduler:run", "-v"]
    network_mode: none
    volumes:
      - meridian-data:/var/lib/meridian
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  worker-http:
    <<: *common
    container_name: meridian-worker-http
    command: ["php", "bin/meridian", "worker:run", "--type=http", "-v"]
    init: true
    stop_grace_period: 40s
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    volumes:
      - meridian-data:/var/lib/meridian
      - meridian-secrets:/etc/meridian:ro
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  worker-shell:
    <<: *common
    container_name: meridian-worker-shell
    command: ["php", "bin/meridian", "worker:run", "--type=shell", "-v"]
    network_mode: none
    init: true
    stop_grace_period: 40s
    environment:
      <<: *env
      MERIDIAN_DOCKER_PROXY: unix:///run/meridian-docker/docker.sock
      MERIDIAN_SHELL_HOST_SOCKETS: default=/run/meridian-host/default.sock,web=/run/meridian-host/default.sock
    volumes:
      - meridian-data:/var/lib/meridian
      - meridian-secrets:/etc/meridian:ro
      - meridian-docker-proxy:/run/meridian-docker
      - meridian-host-socket:/run/meridian-host:ro
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      host-bridge:
        condition: service_healthy

  docker-proxy:
    image: ${MERIDIAN_PROXY_IMAGE:-wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002}
    container_name: meridian-docker-proxy
    pull_policy: missing
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: "0:0"
    group_add:
      - "${MERIDIAN_DOCKER_GID:-0}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - -proxysocketendpoint=/run/proxy/docker.sock
      - -proxysocketendpointfilemode=0666
      - -loglevel=WARN
      - -watchdoginterval=300
      - -stoponwatchdog
      - '-allowGET=((/v1\.[0-9]{2})?/_ping|/v1\.[0-9]{2}/(version|containers/[A-Za-z0-9][A-Za-z0-9_.-]*/json|exec/[0-9a-f]{64}/json))'
      - '-allowHEAD=((/v1\.[0-9]{2})?/_ping)'
      - '-allowPOST=(/v1\.[0-9]{2}/(containers/[A-Za-z0-9][A-Za-z0-9_.-]*/exec|exec/[0-9a-f]{64}/start))'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - meridian-docker-proxy:/run/proxy

  sandbox:
    image: ghcr.io/exploid1/meridian-sandbox:candidate
    pull_policy: always
    container_name: meridian-sandbox
    restart: unless-stopped
    user: "1001:1001"
    command: ["sleep", "2147483647"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=1001,gid=1001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    cpus: 1.0
    networks:
      - sandbox-net
    environment:
      TZ: Europe/Berlin

networks:
  sandbox-net: {}

volumes:
  meridian-data:
  meridian-secrets:
  meridian-docker-proxy:
  meridian-updater-data:
  meridian-host-socket:
