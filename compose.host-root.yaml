# Complete compact stack: explicit host-root access enabled.
# Sandbox when needed: docker compose --profile sandbox up -d
name: meridian
services:
  host-bridge:
    image: ${MERIDIAN_HOST_IMAGE:-ghcr.io/exploid1/meridian:host-latest}
    pull_policy: always
    container_name: meridian-host-bridge
    restart: unless-stopped
    user: 0:0
    privileged: true
    pid: host
    network_mode: none
    read_only: true
    security_opt:
    - no-new-privileges:true
    environment:
      MERIDIAN_DOCKER_HOST_ENABLE: '1'
      MERIDIAN_HOST_UID: '0'
      MERIDIAN_HOST_GID: '0'
      MERIDIAN_HOST_ALLOW_ROOT: '1'
    volumes:
    - meridian-host-socket:/run/meridian-host
    tmpfs:
    - /tmp:size=16m,mode=0700
    stop_grace_period: 15s
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test:
      - CMD
      - php
      - -r
      - $$socket = @stream_socket_client('unix:///run/meridian-host/default.sock', $$errno, $$error, 1); if ($$socket === false) { exit(1);
        } fclose($$socket);
      interval: 10s
      timeout: 3s
      retries: 3
  updater:
    image: ${MERIDIAN_UPDATER_IMAGE:-ghcr.io/exploid1/meridian:updater-latest}
    pull_policy: always
    container_name: meridian-updater
    restart: unless-stopped
    environment:
      MERIDIAN_UPDATE_MODE: docker
      MERIDIAN_DOCKER_PROXY_ENABLE: '1'
      MERIDIAN_COMPACT_STACK: '1'
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - meridian-data:/var/lib/meridian
    - meridian-updater-data:/var/lib/meridian-updater
    - meridian-docker-proxy:/run/meridian-docker
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    pids_limit: 256
    mem_limit: 512m
    group_add:
    - ${MERIDIAN_DOCKER_GID:-0}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python3
      - /usr/local/lib/meridian-updater-entrypoint.py
      - --health
      interval: 5s
      timeout: 4s
      start_period: 90s
      retries: 3
  web:
    image: ${MERIDIAN_IMAGE:-ghcr.io/exploid1/meridian:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      MERIDIAN_TIMEZONE: Europe/Berlin
      FRANKENPHP_CONFIG: num_threads 16
      MERIDIAN_LIVE_STREAMS: '4'
      MERIDIAN_AUTO_SETUP: '1'
      MERIDIAN_ADMIN_USER: admin
      # Replace before first deployment / Vor der Ersteinrichtung ersetzen.
      MERIDIAN_ADMIN_PASSWORD: "BEISPIEL-passwort-bitte-aendern"
      MERIDIAN_ENV: ${MERIDIAN_ENV:-prod}
      MERIDIAN_TRUSTED_PROXIES: 172.19.0.0/16
      MERIDIAN_HTTP_WORKERS: ${MERIDIAN_HTTP_WORKERS:-2}
    volumes:
    - meridian-data:/var/lib/meridian
    - meridian-secrets:/etc/meridian
    read_only: true
    tmpfs: &id001
    - /tmp
    - /config/caddy:uid=1000,gid=1000
    - /data/caddy:uid=1000,gid=1000
    security_opt: &id002
    - no-new-privileges:true
    cap_drop: &id003
    - ALL
    container_name: meridian-web
    sysctls:
      net.ipv4.ping_group_range: 0 2147483647
    ports:
    - ${MERIDIAN_PORT:-8090}:8080
    command:
    - php
    - bin/meridian-runtime
    init: true
    stop_grace_period: 45s
    healthcheck:
      test:
      - CMD
      - php
      - bin/meridian-runtime
      - health
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
  worker-shell:
    image: ${MERIDIAN_IMAGE:-ghcr.io/exploid1/meridian:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      MERIDIAN_TIMEZONE: Europe/Berlin
      MERIDIAN_DOCKER_PROXY: unix:///run/meridian-docker/docker.sock
      MERIDIAN_SHELL_HOST_SOCKETS: default=/run/meridian-host/default.sock,web=/run/meridian-host/default.sock
    volumes:
    - meridian-data:/var/lib/meridian
    - meridian-secrets:/etc/meridian:ro
    - meridian-docker-proxy:/run/meridian-docker
    - meridian-host-socket:/run/meridian-host:ro
    read_only: true
    tmpfs: *id001
    security_opt: *id002
    cap_drop: *id003
    container_name: meridian-worker-shell
    command:
    - php
    - bin/meridian
    - worker:run
    - --type=shell
    - --child
    network_mode: none
    init: true
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, php, bin/meridian-runtime, shell-health]
      interval: 10s
      timeout: 4s
      start_period: 30s
      retries: 3
    depends_on:
      web:
        condition: service_healthy
      host-bridge:
        condition: service_healthy
      updater:
        condition: service_healthy
  sandbox:
    image: ${MERIDIAN_SANDBOX_IMAGE:-ghcr.io/exploid1/meridian-sandbox:latest}
    pull_policy: always
    container_name: meridian-sandbox
    restart: unless-stopped
    user: 1001:1001
    command:
    - sleep
    - '2147483647'
    init: true
    read_only: true
    tmpfs:
    - /tmp:size=64m,uid=1001,gid=1001,mode=0700
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 512m
    pids_limit: 256
    cpus: 1.0
    networks:
    - sandbox-net
    environment:
      TZ: Europe/Berlin
    profiles:
    - sandbox
networks:
  sandbox-net: {}
volumes:
  meridian-data: null
  meridian-secrets: null
  meridian-docker-proxy: null
  meridian-updater-data: null
  meridian-host-socket: null
