# Meridian: docker compose up -d --build
# Updates: docker compose build --pull --no-cache && docker compose up -d
# Quelle: main; MERIDIAN_REPO_REF erlaubt einen anderen Branch, Tag oder Commit.
# Konfiguration und Sicherung: README.md und docs/BETRIEB.md

name: meridian

x-common: &common
  build:
    context: .
    dockerfile_inline: |
        FROM alpine:3 AS source
        ADD https://github.com/eXplOiD1/meridian/archive/${MERIDIAN_REPO_REF:-main}.tar.gz /src.tar.gz
        RUN mkdir /src && tar xzf /src.tar.gz -C /src --strip-components=1

        FROM composer:2 AS vendor
        WORKDIR /app
        COPY --from=source /src/composer.json /src/composer.lock* ./
        RUN composer install --no-dev --no-interaction --prefer-dist --no-scripts --no-autoloader \
            --ignore-platform-req=ext-pdo_sqlite --ignore-platform-req=ext-sodium --ignore-platform-req=ext-curl --ignore-platform-req=ext-mbstring
        COPY --from=source /src/src/ src/
        RUN composer dump-autoload --no-dev --classmap-authoritative \
            --ignore-platform-req=ext-pdo_sqlite --ignore-platform-req=ext-sodium --ignore-platform-req=ext-curl --ignore-platform-req=ext-mbstring

        FROM node:22-alpine AS ui
        WORKDIR /ui
        COPY --from=source /src/frontend/package.json /src/frontend/package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY --from=source /src/frontend/ ./
        RUN npm run build

        FROM dunglas/frankenphp:1-php8.4-alpine

        RUN apk add --no-cache iputils \
         && install-php-extensions pdo_sqlite sodium pcntl opcache mbstring gmp \
         && addgroup -S -g 1000 meridian \
         && adduser -S -u 1000 -G meridian -h /var/lib/meridian meridian \
         && mkdir -p /var/lib/meridian /etc/meridian /config/caddy /data/caddy \
         && chown -R meridian:meridian /var/lib/meridian /etc/meridian /config/caddy /data/caddy \
         && chmod 0700 /etc/meridian \
         && php -m | grep -qi '^curl$$' \
         && php -r 'exit(in_array("https", curl_version()["protocols"], true) ? 0 : 1);' \
         && test -s /etc/ssl/certs/ca-certificates.crt \
         && setcap -r /usr/local/bin/frankenphp \
         && cp "$$PHP_INI_DIR/php.ini-production" "$$PHP_INI_DIR/php.ini" \
         && printf 'expose_php=Off\ndisplay_errors=Off\nlog_errors=On\nsession.cookie_httponly=1\nsession.cookie_secure=1\nsession.cookie_samesite=Strict\n' > "$$PHP_INI_DIR/conf.d/meridian.ini"

        WORKDIR /app
        COPY --from=vendor /app/vendor ./vendor
        ARG MERIDIAN_REVISION=unknown
        RUN printf '%s\n' "$$MERIDIAN_REVISION" > /app/REVISION
        COPY --from=source /src/bin/ bin/
        COPY --from=source /src/migrations/ migrations/
        COPY --from=source /src/public/ public/
        COPY --from=source /src/src/ src/
        COPY --from=ui /ui/dist /app/ui
        COPY --from=source /src/LICENSE /src/THIRD_PARTY_NOTICES.md /app/
        COPY --from=source /src/licenses/ /app/licenses/
        COPY --from=source --chmod=0755 /src/docker/entrypoint.sh /usr/local/bin/meridian-entrypoint

        ENV MERIDIAN_DATA_DIR=/var/lib/meridian \
            MERIDIAN_KEY_FILE=/etc/meridian/master.key \
            MERIDIAN_ENV=prod \
            SERVER_NAME=":8080" \
            SERVER_ROOT=/app/public

        USER meridian
        EXPOSE 8080
        VOLUME ["/var/lib/meridian", "/etc/meridian"]

        ENTRYPOINT ["meridian-entrypoint", "docker-php-entrypoint"]
        CMD ["--config", "/etc/frankenphp/Caddyfile", "--adapter", "caddyfile"]

        HEALTHCHECK --interval=30s --timeout=5s --start-period=20s --retries=3 \
          CMD wget -qO- http://127.0.0.1:8080/api/health || exit 1

  image: meridian:local
  pull_policy: build
  restart: unless-stopped
  environment: &env
    TZ: Europe/Berlin
    MERIDIAN_TIMEZONE: Europe/Berlin
  volumes:
    - meridian-data:/var/lib/meridian
    - meridian-secrets:/etc/meridian
  read_only: true
  tmpfs:
    - /tmp
    - /config/caddy:uid=1000,gid=1000
    - /data/caddy:uid=1000,gid=1000
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  updater:
    build:
      dockerfile_inline: |
        # --- Quellcode von GitHub (Archiv per HTTPS, auf dem Host wird kein git gebraucht) ---------
        FROM alpine:3 AS source
        ADD https://github.com/eXplOiD1/meridian/archive/${MERIDIAN_REPO_REF:-main}.tar.gz /src.tar.gz
        RUN mkdir /src && tar xzf /src.tar.gz -C /src --strip-components=1

        FROM docker:27-cli
        RUN apk add --no-cache python3
        COPY --from=source /src/deploy/updater.py /usr/local/lib/meridian-updater.py
        COPY --from=source /src/LICENSE /src/THIRD_PARTY_NOTICES.md /usr/local/share/meridian/
        COPY --from=source /src/licenses/ /usr/local/share/meridian/licenses/
        RUN python3 -m py_compile /usr/local/lib/meridian-updater.py
        RUN python3 - <<'PY'
        import importlib.util, json, os, pathlib, tempfile
        spec = importlib.util.spec_from_file_location('meridian_updater', '/usr/local/lib/meridian-updater.py')
        module = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(module)
        module.command = lambda *args, **kwargs: 'a' * 40
        with tempfile.TemporaryDirectory() as temporary:
            root = pathlib.Path(temporary)
            (root / 'data').mkdir()
            os.environ.update(MERIDIAN_UPDATE_MODE='docker', MERIDIAN_UPDATE_DATA=str(root / 'data'), MERIDIAN_UPDATE_PRIVATE=str(root / 'private'), MERIDIAN_UPDATE_UID='0', MERIDIAN_UPDATE_GID='0')
            updater = module.Updater()
            updater.publish()
            queue = root / 'data/updates/request.json'
            queue.write_text(json.dumps({'action': 'check', 'id': 'b' * 32}))
            assert updater.request() == 'check' and not queue.exists()
            queue.write_text(json.dumps({'action': 'shell', 'id': 'b' * 32}))
            assert updater.request() is None and not queue.exists()
            target = root / 'private/protected'
            target.write_text('unchanged')
            queue.symlink_to(target)
            try:
                updater.request()
                raise AssertionError('symlink must be rejected')
            except OSError:
                pass
            assert target.read_text() == 'unchanged'
            assert json.loads((root / 'data/updates/status.json').read_text())['mode'] == 'docker'
            os.close(updater.fd)
            os.close(updater.lock)
        print('Linux update queue and symlink protection passed.')
        PY
        ENV MERIDIAN_UPDATE_MODE=docker
        CMD ["python3", "/usr/local/lib/meridian-updater.py"]
    image: meridian-updater:local
    container_name: meridian-updater
    restart: unless-stopped
    environment:
      MERIDIAN_UPDATE_MODE: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - meridian-data:/var/lib/meridian
      - meridian-updater-data:/var/lib/meridian-updater
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 256
    mem_limit: 512m
  web:
    <<: *common
    container_name: meridian-web
    environment:
      <<: *env
      FRANKENPHP_CONFIG: "num_threads 16"
      MERIDIAN_LIVE_STREAMS: "4"
      MERIDIAN_AUTO_SETUP: "1"
      MERIDIAN_ADMIN_USER: "admin"
      MERIDIAN_ADMIN_PASSWORD: "BEISPIEL-passwort-bitte-aendern"
      MERIDIAN_ENV: ${MERIDIAN_ENV:-prod}
      MERIDIAN_TRUSTED_PROXIES: "172.19.0.0/16"
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    ports:
      - "${MERIDIAN_PORT:-8090}:8080"

  scheduler:
    <<: *common
    container_name: meridian-scheduler
    command: ["php", "bin/meridian", "scheduler:run", "-v"]
    network_mode: none
    volumes:
      - meridian-data:/var/lib/meridian
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  worker-http:
    <<: *common
    container_name: meridian-worker-http
    command: ["php", "bin/meridian", "worker:run", "--type=http", "-v"]
    init: true
    stop_grace_period: 40s
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    volumes:
      - meridian-data:/var/lib/meridian
      - meridian-secrets:/etc/meridian:ro
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  worker-shell:
    <<: *common
    container_name: meridian-worker-shell
    command: ["php", "bin/meridian", "worker:run", "--type=shell", "-v"]
    network_mode: none
    init: true
    stop_grace_period: 40s
    environment:
      <<: *env
      MERIDIAN_DOCKER_PROXY: unix:///run/meridian-docker/docker.sock
    volumes:
      - meridian-data:/var/lib/meridian
      - meridian-secrets:/etc/meridian:ro
      - meridian-docker-proxy:/run/meridian-docker
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
      docker-proxy:
        condition: service_started

  docker-proxy:
    image: ${MERIDIAN_PROXY_IMAGE:-wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002}
    container_name: meridian-docker-proxy
    pull_policy: missing
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: "0:0"
    group_add:
      - "${MERIDIAN_DOCKER_GID:-0}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - -proxysocketendpoint=/run/proxy/docker.sock
      - -proxysocketendpointfilemode=0666
      - -loglevel=WARN
      - -watchdoginterval=300
      - -stoponwatchdog
      - '-allowGET=((/v1\.[0-9]{2})?/_ping|/v1\.[0-9]{2}/(version|containers/[A-Za-z0-9][A-Za-z0-9_.-]*/json|exec/[0-9a-f]{64}/json))'
      - '-allowHEAD=((/v1\.[0-9]{2})?/_ping)'
      - '-allowPOST=(/v1\.[0-9]{2}/(containers/[A-Za-z0-9][A-Za-z0-9_.-]*/exec|exec/[0-9a-f]{64}/start))'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - meridian-docker-proxy:/run/proxy

  sandbox:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache bash curl jq ca-certificates tzdata \
         && adduser -D -u 1001 -h /tmp sandbox
        USER 1001:1001
        WORKDIR /tmp
    image: meridian-sandbox:local
    pull_policy: build
    container_name: meridian-sandbox
    restart: unless-stopped
    user: "1001:1001"
    command: ["sleep", "2147483647"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=1001,gid=1001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    cpus: 1.0
    networks:
      - sandbox-net
    environment:
      TZ: Europe/Berlin

networks:
  sandbox-net: {}

volumes:
  meridian-data:
  meridian-secrets:
  meridian-docker-proxy:
  meridian-updater-data:
