# Meridian für Docker Compose (z. B. UGOS-Docker-App). Diese eine Datei genügt, es ist nichts vorzubereiten:
# Das Image wird beim Start aus GitHub gebaut. Beim ersten Start legt der Container selbst an:
#   - den Hauptschlüssel (Volume meridian-secrets, wird nie überschrieben),
#   - die Datenbank (Volume meridian-data),
#   - den ersten Admin. Ohne Angabe: Benutzer "admin" mit zufälligem Passwort, einmalig im Log
#     (docker compose logs web). Eigene Zugangsdaten über MERIDIAN_ADMIN_USER / MERIDIAN_ADMIN_PASSWORD
#     (mind. 8 Zeichen) in einer .env neben dieser Datei oder unter "environment" setzen.
#
# Aktualisieren: Projekt neu bereitstellen bzw. docker compose build --pull --no-cache && docker compose up -d
# Version wählen: MERIDIAN_REPO_REF (Branch, Tag oder Commit), Port: MERIDIAN_PORT (Standard 8090).
# Der Inline-Dockerfile entspricht docker/Dockerfile im Repository, bei Änderungen beide anpassen.
#
# UPDATE AUF DIE VERSION MIT SHELL-JOBS (Phase 4) - bitte beachten:
#   - Diese compose.yaml KOMPLETT neu einfügen (nicht nur einzelne Zeilen): Es gibt neue Dienste
#     (worker-http, worker-shell, docker-proxy, sandbox), der scheduler verliert Schlüssel und Netz.
#   - Das Volume meridian-secrets (Hauptschlüssel) und meridian-data bleiben unverändert und werden weiterverwendet.
#   - Neu ist das Volume meridian-docker-proxy (Unix-Socket des Docker-Proxys; nur docker-proxy und worker-shell
#     binden es ein). Es entsteht von selbst.
#   - Der Dienst docker-proxy bindet /var/run/docker.sock (nur lesend) ein - als einziger. Auf UGOS liegt der Socket
#     dort; hat er eine andere Gruppe als root, MERIDIAN_DOCKER_GID auf diese Gruppen-ID setzen.
#   - Proxy-Image festnageln: MERIDIAN_PROXY_IMAGE (Standard wollomatic/socket-proxy:1.13.1 ohne Digest). Empfohlen:
#     Digest ermitteln (docker buildx imagetools inspect wollomatic/socket-proxy:1.13.1) und in der .env eintragen:
#     MERIDIAN_PROXY_IMAGE=wollomatic/socket-proxy:1.13.1@sha256:<ermittelter Digest>   (nie :latest)
#   - Shell-Jobs in Containern: Namen der erlaubten Container (zweite Schicht neben den Freigaben in Meridian)
#     in MERIDIAN_SHELL_CONTAINERS eintragen, getrennt durch |, nur [A-Za-z0-9_-], z. B. meridian-sandbox|nextcloud.
#     Standard: nur meridian-sandbox. Danach docker compose up -d (der Proxy liest die Liste beim Start).

name: meridian

x-common: &common
  build:
    context: .
    dockerfile_inline: |
        # --- Quellcode von GitHub (Archiv per HTTPS, auf dem Host wird kein git gebraucht) ---------
        FROM alpine:3 AS source
        ADD https://github.com/eXplOiD1/meridian/archive/${MERIDIAN_REPO_REF:-claude/great-clarke-ubr0vc}.tar.gz /src.tar.gz
        RUN mkdir /src && tar xzf /src.tar.gz -C /src --strip-components=1

        # --- Abhängigkeiten -------------------------------------------------------
        FROM composer:2 AS vendor
        WORKDIR /app
        COPY --from=source /src/composer.json /src/composer.lock* ./
        # Die PHP-Extensions bringt das Laufzeit-Image mit; hier nur die Pakete laden.
        RUN composer install --no-dev --no-interaction --prefer-dist --no-scripts --no-autoloader \
            --ignore-platform-req=ext-pdo_sqlite --ignore-platform-req=ext-sodium --ignore-platform-req=ext-curl
        COPY --from=source /src/src/ src/
        RUN composer dump-autoload --no-dev --classmap-authoritative \
            --ignore-platform-req=ext-pdo_sqlite --ignore-platform-req=ext-sodium --ignore-platform-req=ext-curl

        # --- Oberfläche (React + Vite) --------------------------------------------
        FROM node:22-alpine AS ui
        WORKDIR /ui
        COPY --from=source /src/frontend/package.json /src/frontend/package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY --from=source /src/frontend/ ./
        RUN npm run build

        # --- Laufzeit -------------------------------------------------------------
        FROM dunglas/frankenphp:1-php8.4-alpine

        RUN install-php-extensions pdo_sqlite sodium pcntl opcache \
         && addgroup -S -g 1000 meridian \
         && adduser -S -u 1000 -G meridian -h /var/lib/meridian meridian \
         && mkdir -p /var/lib/meridian /etc/meridian /config/caddy /data/caddy \
         && chown -R meridian:meridian /var/lib/meridian /etc/meridian /config/caddy /data/caddy \
         && chmod 0700 /etc/meridian \
         # Build-Zeit-Prüfung für den HTTP-Runner: curl-Erweiterung mit TLS und CA-Bündel müssen vorhanden sein.
         && php -m | grep -qi '^curl$$' \
         && php -r 'exit(in_array("https", curl_version()["protocols"], true) ? 0 : 1);' \
         && test -s /etc/ssl/certs/ca-certificates.crt \
         # Ohne diese Datei-Capability startet FrankenPHP nicht mit cap_drop ALL + no-new-privileges
         # (exec: "Operation not permitted"). Port 8080 braucht sie nicht.
         && setcap -r /usr/local/bin/frankenphp \
         && cp "$$PHP_INI_DIR/php.ini-production" "$$PHP_INI_DIR/php.ini" \
         && printf 'expose_php=Off\ndisplay_errors=Off\nlog_errors=On\nsession.cookie_httponly=1\nsession.cookie_secure=1\nsession.cookie_samesite=Strict\n' > "$$PHP_INI_DIR/conf.d/meridian.ini"

        WORKDIR /app
        COPY --from=vendor /app/vendor ./vendor
        COPY --from=source /src/bin/ bin/
        COPY --from=source /src/migrations/ migrations/
        COPY --from=source /src/public/ public/
        COPY --from=source /src/src/ src/
        # Die gebaute Oberfläche liegt außerhalb von public/: der Kernel liefert sie aus (mit allen Sicherheits-Headern).
        COPY --from=ui /ui/dist /app/ui
        COPY --from=source --chmod=0755 /src/docker/entrypoint.sh /usr/local/bin/meridian-entrypoint

        ENV MERIDIAN_DATA_DIR=/var/lib/meridian \
            MERIDIAN_KEY_FILE=/etc/meridian/master.key \
            MERIDIAN_ENV=prod \
            SERVER_NAME=":8080" \
            SERVER_ROOT=/app/public

        USER meridian
        EXPOSE 8080
        # Daten und Schlüssel in Volumes; Docker übernimmt dabei die Besitzer aus dem Image.
        VOLUME ["/var/lib/meridian", "/etc/meridian"]

        ENTRYPOINT ["meridian-entrypoint", "docker-php-entrypoint"]
        # Ein eigener ENTRYPOINT verwirft das CMD des Basis-Images, deshalb hier wieder setzen.
        CMD ["--config", "/etc/frankenphp/Caddyfile", "--adapter", "caddyfile"]

        HEALTHCHECK --interval=30s --timeout=5s --start-period=20s --retries=3 \
          CMD wget -qO- http://127.0.0.1:8080/api/health || exit 1

  image: meridian:local
  pull_policy: build
  restart: unless-stopped
  environment: &env
    TZ: Europe/Berlin
    MERIDIAN_TIMEZONE: Europe/Berlin
  volumes:
    - meridian-data:/var/lib/meridian
    - meridian-secrets:/etc/meridian
  read_only: true
  tmpfs:
    - /tmp
    - /config/caddy:uid=1000,gid=1000
    - /data/caddy:uid=1000,gid=1000
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  web:
    <<: *common
    container_name: meridian-web
    environment:
      <<: *env
      # Mehr Threads, damit das Live-Log (Server-Sent Events, höchstens MERIDIAN_LIVE_STREAMS gleichzeitig)
      # die übrigen Anfragen nicht aufhält.
      FRANKENPHP_CONFIG: "num_threads 16"
      MERIDIAN_LIVE_STREAMS: "4"
      # Beim ersten Start: Schlüssel, Datenbank und Admin automatisch anlegen.
      MERIDIAN_AUTO_SETUP: "1"
      MERIDIAN_ADMIN_USER: ${MERIDIAN_ADMIN_USER:-}
      MERIDIAN_ADMIN_PASSWORD: ${MERIDIAN_ADMIN_PASSWORD:-}
      # Sicherer als das Passwort in der Umgebung (sichtbar in docker inspect): eine Datei, z. B. ein Docker-Secret,
      # und hier MERIDIAN_ADMIN_PASSWORD_FILE auf deren Pfad setzen. Nach dem ersten Start beides entfernen.
      # Empfohlen ist HTTPS (z. B. hinter dem Nginx Proxy Manager): dann Secure-Cookie mit __Host-Präfix.
      # Über reines HTTP (LAN) geht die Anmeldung auch, die Oberfläche zeigt dann dauerhaft eine Warnung.
      # MERIDIAN_ENV bleibt prod; dev ist nur für die Entwicklung (kein HSTS, ausführlichere Fehlerhinweise).
      MERIDIAN_ENV: ${MERIDIAN_ENV:-prod}
      # IP des Reverse-Proxys, damit Sperre und Audit die echte Client-IP sehen, z. B. 172.19.0.0/16.
      # Pflicht hinter einem Proxy: Anmeldungen mit X-Forwarded-For/Forwarded ohne diese Angabe werden abgelehnt.
      MERIDIAN_TRUSTED_PROXIES: ${MERIDIAN_TRUSTED_PROXIES:-}
    ports:
      - "${MERIDIAN_PORT:-8090}:8080"

  # Der Planer plant nur und führt nichts aus: kein Hauptschlüssel, kein Netz.
  scheduler:
    <<: *common
    container_name: meridian-scheduler
    command: ["php", "bin/meridian", "scheduler:run", "-v"]
    network_mode: none
    volumes:
      - meridian-data:/var/lib/meridian
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  # Führt HTTP-Jobs aus. Hat Netz (für die Ziele), aber keinen Docker-Zugang und kein Proxy-Volume.
  worker-http:
    <<: *common
    container_name: meridian-worker-http
    command: ["php", "bin/meridian", "worker:run", "--type=http", "-v"]
    init: true
    stop_grace_period: 40s
    volumes:
      - meridian-data:/var/lib/meridian
      - meridian-secrets:/etc/meridian:ro
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  # Führt Shell-Jobs aus (nur über den Docker-Proxy in Containern). Kein Netz: erreicht nur den Unix-Socket.
  worker-shell:
    <<: *common
    container_name: meridian-worker-shell
    command: ["php", "bin/meridian", "worker:run", "--type=shell", "-v"]
    network_mode: none
    init: true
    stop_grace_period: 40s
    environment:
      <<: *env
      MERIDIAN_DOCKER_PROXY: unix:///run/meridian-docker/docker.sock
      MERIDIAN_SHELL_CONTAINERS: ${MERIDIAN_SHELL_CONTAINERS:-meridian-sandbox}
    volumes:
      - meridian-data:/var/lib/meridian
      - meridian-secrets:/etc/meridian:ro
      - meridian-docker-proxy:/run/meridian-docker
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
      docker-proxy:
        condition: service_started

  # Docker nur über diesen Proxy (nie /var/run/docker.sock in einem Meridian-Container). wollomatic prüft Methode UND
  # Pfad: erlaubt sind nur _ping, version, Container-Info der erlaubten Namen, Exec anlegen/starten/abfragen.
  # containers/create, start, kill, rm usw. -> 403. Kein Netz, keine IP-Adresse: lauscht nur auf dem Unix-Socket im
  # Volume meridian-docker-proxy. Läuft als root ohne Capabilities (nötig, um den Socket zu lesen und zu schreiben).
  # Die Regeln sind verankert (^...$ ergänzt der Proxy); Namen in MERIDIAN_SHELL_CONTAINERS nur aus [A-Za-z0-9_-].
  docker-proxy:
    image: ${MERIDIAN_PROXY_IMAGE:-wollomatic/socket-proxy:1.13.1}
    container_name: meridian-docker-proxy
    pull_policy: missing
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: "0:0"
    group_add:
      - "${MERIDIAN_DOCKER_GID:-0}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - -proxysocketendpoint=/run/proxy/docker.sock
      - -proxysocketendpointfilemode=0666
      - -loglevel=WARN
      - -watchdoginterval=300
      - -stoponwatchdog
      - '-allowGET=((/v1\.[0-9]{2})?/_ping|/v1\.[0-9]{2}/(version|containers/(${MERIDIAN_SHELL_CONTAINERS:-meridian-sandbox})/json|exec/[0-9a-f]{64}/json))'
      - '-allowHEAD=((/v1\.[0-9]{2})?/_ping)'
      - '-allowPOST=(/v1\.[0-9]{2}/(containers/(${MERIDIAN_SHELL_CONTAINERS:-meridian-sandbox})/exec|exec/[0-9a-f]{64}/start))'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - meridian-docker-proxy:/run/proxy

  # Standard-Ausführungsort für Shell-Jobs (wird nicht automatisch freigegeben: in Meridian unter Einstellungen ->
  # Ausführungsorte "docker meridian-sandbox" mit Benutzer 1001 eintragen). Keine Volumes, kein Zugang zu Schlüssel,
  # Datenbank oder Proxy; eigenes Netz mit Ausgang (z. B. curl auf interne Dienste). Entspricht docker/Dockerfile.sandbox.
  sandbox:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache bash curl jq ca-certificates tzdata \
         && adduser -D -u 1001 -h /tmp sandbox
        USER 1001:1001
        WORKDIR /tmp
    image: meridian-sandbox:local
    pull_policy: build
    container_name: meridian-sandbox
    restart: unless-stopped
    user: "1001:1001"
    command: ["sleep", "2147483647"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=1001,gid=1001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    cpus: 1.0
    networks:
      - sandbox-net
    environment:
      TZ: Europe/Berlin

networks:
  sandbox-net: {}

volumes:
  meridian-data:
  meridian-secrets:
  meridian-docker-proxy:
