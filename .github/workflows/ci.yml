name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Geheimnisse im Verlauf suchen
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sodium
          coverage: none

      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: composer phpstan
      - run: composer psalm
      - run: composer taint
      - run: composer test
