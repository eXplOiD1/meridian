name: Container images
on:
  push:
    branches: [main, beta]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: meridian
            dockerfile: docker/Dockerfile
          - image: meridian-sandbox
            dockerfile: docker/Dockerfile.sandbox
          - image: meridian
            dockerfile: docker/Dockerfile.updater
            variant: updater-
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/exploid1/${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.variant }}latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ matrix.variant }}main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ matrix.variant }}candidate,enable=${{ github.ref != 'refs/heads/main' }}
            type=sha,format=long,prefix=${{ matrix.variant }}sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MERIDIAN_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.variant }}
