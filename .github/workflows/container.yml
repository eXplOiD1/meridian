name: Container images
on:
  push:
    branches: [main, beta]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-bridge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise opt-in host bridge on Linux
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.host-root.yaml config --quiet
          docker compose -f compose.yaml config --quiet
          docker build -f docker/Dockerfile.host -t meridian-host-test .
          docker volume create meridian-host-test-socket
          trap 'docker rm -f meridian-host-test >/dev/null 2>&1 || true; docker volume rm meridian-host-test-socket >/dev/null 2>&1 || true' EXIT
          # The bridge must reject omitted activation and accidental root jobs.
          if docker run --rm --privileged --pid=host meridian-host-test; then exit 1; fi
          if docker run --rm --privileged --pid=host -e MERIDIAN_DOCKER_HOST_ENABLE=1 -e MERIDIAN_HOST_UID=0 -e MERIDIAN_HOST_GID=0 meridian-host-test; then exit 1; fi
          docker run -d --name meridian-host-test --privileged --pid=host --network=none --read-only --security-opt=no-new-privileges:true --tmpfs /tmp -e MERIDIAN_DOCKER_HOST_ENABLE=1 -e MERIDIAN_HOST_UID=65534 -e MERIDIAN_HOST_GID=65534 -e BRIDGE_SECRET=must-not-reach-job -v meridian-host-test-socket:/run/meridian-host meridian-host-test
          for attempt in $(seq 1 30); do
            if docker exec meridian-host-test php -r 'exit(file_exists("/run/meridian-host/default.sock") ? 0 : 1);'; then break; fi
            sleep 1
          done
          docker run --rm -i --user=1000:1000 --network=none --read-only -v meridian-host-test-socket:/run/meridian-host:ro --entrypoint=php meridian-host-test <<'PHP'
          <?php
          require '/app/vendor/autoload.php';
          use Meridian\Runner\Shell\{ExecSpec, HostSocketExecutor, HostSockets, ShellInterpreter, ShellTarget, ShellTargetKind};
          $executor = new HostSocketExecutor(HostSockets::parse('default=/run/meridian-host/default.sock'));
          $start = static function (string $script) use ($executor) {
              return $executor->start(new ExecSpec(1, 1, 'test', new ShellTarget(ShellTargetKind::Host, 'default'), ShellInterpreter::Sh, null, null, 'UTC', ExecSpec::newNonce(), $script, []));
          };
          $collect = static function ($execution): string {
              $out = ''; $deadline = microtime(true) + 10;
              while (!$execution->finished() && microtime(true) < $deadline) {
                  $block = $execution->read(0.2);
                  if ($block !== null) { $out .= $block->bytes(); }
              }
              if (!$execution->finished()) { $execution->close(); throw new RuntimeException('Execution timed out'); }
              return $out;
          };
          $run = $start('id -u; id -g; pwd; printf "%s" "${BRIDGE_SECRET-unset}"');
          $out = $collect($run);
          if ($run->exitCode() !== 0 || !preg_match('#^65534\n65534\n/tmp/meridian-host-[0-9a-f]{32}/run-1-[0-9a-f]{32}\nunset$#D', $out)) { throw new RuntimeException('Wrong host identity, working directory or environment'); }
          $run->close();
          foreach (['kill', 'disconnect'] as $mode) {
              $run = $start('sleep 60 & echo $!; wait');
              $out = ''; $deadline = microtime(true) + 5;
              while (!str_contains($out, "\n") && microtime(true) < $deadline) {
                  $block = $run->read(0.2); if ($block !== null) { $out .= $block->bytes(); }
              }
              if (!preg_match('/^[1-9][0-9]*\n$/D', $out)) { throw new RuntimeException('No child PID'); }
              $pid = (int) trim($out);
              if ($mode === 'kill') { $run->kill(); $collect($run); }
              $run->close();
              usleep(500000);
              $check = $start('if kill -0 ' . $pid . ' 2>/dev/null; then exit 9; fi');
              $collect($check);
              if ($check->exitCode() !== 0) { throw new RuntimeException('Background process survived cancellation'); }
              $check->close();
          }
          echo "Host identity, private directory, environment and process-group cleanup passed.\n";
          PHP
          docker stop meridian-host-test
          docker rm meridian-host-test
          docker run -d --name meridian-host-test --privileged --pid=host --network=none --read-only --security-opt=no-new-privileges:true --tmpfs /tmp -e MERIDIAN_DOCKER_HOST_ENABLE=1 -e MERIDIAN_HOST_UID=0 -e MERIDIAN_HOST_GID=0 -e MERIDIAN_HOST_ALLOW_ROOT=1 -v meridian-host-test-socket:/run/meridian-host meridian-host-test
          for attempt in $(seq 1 30); do
            if docker exec meridian-host-test php -r 'exit(file_exists("/run/meridian-host/default.sock") ? 0 : 1);'; then break; fi
            sleep 1
          done
          docker run --rm -i --user=1000:1000 --network=none --read-only -v meridian-host-test-socket:/run/meridian-host:ro --entrypoint=php meridian-host-test <<'PHP'
          <?php
          require '/app/vendor/autoload.php';
          use Meridian\Runner\Shell\{ExecSpec, HostSocketExecutor, HostSockets, ShellInterpreter, ShellTarget, ShellTargetKind};
          $executor = new HostSocketExecutor(HostSockets::parse('web=/run/meridian-host/default.sock'));
          $run = $executor->start(new ExecSpec(1, 1, 'test', new ShellTarget(ShellTargetKind::Host, 'web'), ShellInterpreter::Sh, null, null, 'UTC', ExecSpec::newNonce(), 'id -u; id -g', []));
          $out = ''; $deadline = microtime(true) + 10;
          while (!$run->finished() && microtime(true) < $deadline) {
              $block = $run->read(0.2); if ($block !== null) { $out .= $block->bytes(); }
          }
          if (!$run->finished() || $run->exitCode() !== 0 || $out !== "0\n0\n") { $run->close(); throw new RuntimeException('Explicit host-root execution failed'); }
          $run->close();
          echo "Explicit host-root execution through the web profile passed.\n";
          PHP
  compact-stack-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact application and maintenance images
        run: |
          docker build -f docker/Dockerfile -t meridian-compact-test .
          docker build -f docker/Dockerfile.updater -t meridian-maintenance-test .
          docker build -f docker/Dockerfile.host -t meridian-bridge-test .
      - name: Check normal and host-root stacks, isolation and restart recovery
        shell: bash
        env:
          MERIDIAN_IMAGE: meridian-compact-test
          MERIDIAN_UPDATER_IMAGE: meridian-maintenance-test
          MERIDIAN_HOST_IMAGE: meridian-bridge-test
          MERIDIAN_ADMIN_PASSWORD: Integration-only-password
        run: |
          set -euxo pipefail
          # Local images are loaded already; Compose must not try to pull them.
          printf '%s\n' '{"services":{"web":{"pull_policy":"never"},"worker-shell":{"pull_policy":"never"},"updater":{"pull_policy":"never"},"host-bridge":{"pull_policy":"never"}}}' > /tmp/local-root.json
          printf '%s\n' '{"services":{"web":{"pull_policy":"never"},"worker-shell":{"pull_policy":"never"},"updater":{"pull_policy":"never"}}}' > /tmp/local-normal.json
          trap 'docker compose -f compose.host-root.yaml -f /tmp/local-root.json logs --tail=80 || true; docker compose -f compose.host-root.yaml -f /tmp/local-root.json down -v --remove-orphans || true' EXIT
          docker compose -f compose.yaml -f /tmp/local-normal.json up -d --wait --wait-timeout 180
          test "$(docker compose -f compose.yaml ps --status running --services | wc -l)" -eq 3
          test "$(docker exec meridian-web php -r 'echo count(json_decode(file_get_contents("/tmp/meridian-runtime/pids.json"),true));')" -eq 3
          docker exec meridian-web php bin/meridian-runtime pause
          docker restart meridian-web
          sleep 3
          docker exec meridian-web php bin/meridian-runtime health
          test "$(docker exec meridian-web php -r 'echo count(json_decode(file_get_contents("/tmp/meridian-runtime/pids.json"),true));')" -eq 1
          docker exec meridian-web php bin/meridian-runtime resume
          sleep 3
          test "$(docker exec meridian-web php -r 'echo count(json_decode(file_get_contents("/tmp/meridian-runtime/pids.json"),true));')" -eq 3
          docker restart meridian-web
          sleep 3
          docker exec meridian-web php bin/meridian-runtime health
          test "$(docker exec meridian-web php -r 'echo count(json_decode(file_get_contents("/tmp/meridian-runtime/pids.json"),true));')" -eq 3
          docker exec meridian-worker-shell php -r '$c=stream_socket_client("unix:///run/meridian-docker/docker.sock"); fwrite($c,"GET /containers/json HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"); $r=stream_get_contents($c); if (!str_contains($r,"403")) exit(1);'
          # Migration removes only the known services from this project.
          for service in scheduler worker-http docker-proxy; do
            docker run -d --name "meridian-$service" --label com.docker.compose.project=meridian --label "com.docker.compose.service=$service" --entrypoint sh meridian-compact-test -c 'sleep 300'
          done
          docker run -d --name unrelated-job --label com.docker.compose.project=other --entrypoint sh meridian-compact-test -c 'sleep 300'
          docker restart meridian-updater
          for attempt in $(seq 1 60); do
            if test "$(docker inspect --format '{{.State.Health.Status}}' meridian-updater)" = healthy && ! docker inspect meridian-docker-proxy >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for service in scheduler worker-http docker-proxy; do
            if docker inspect "meridian-$service" >/dev/null 2>&1; then exit 1; fi
          done
          test "$(docker inspect --format '{{.State.Running}}' unrelated-job)" = true
          docker rm -f unrelated-job
          # Preserve the account/key/data while switching the complete Compose variant.
          docker compose -f compose.yaml -f /tmp/local-normal.json down
          docker compose -f compose.host-root.yaml -f /tmp/local-root.json up -d --wait --wait-timeout 180
          test "$(docker compose -f compose.host-root.yaml ps --status running --services | wc -l)" -eq 4
          docker exec meridian-worker-shell php -r 'require "vendor/autoload.php"; use Meridian\Runner\Shell\{ExecSpec,HostSocketExecutor,HostSockets,ShellInterpreter,ShellTarget,ShellTargetKind}; $e=new HostSocketExecutor(HostSockets::parse(getenv("MERIDIAN_SHELL_HOST_SOCKETS"))); $r=$e->start(new ExecSpec(1,1,"test",new ShellTarget(ShellTargetKind::Host,"web"),ShellInterpreter::Sh,null,null,"UTC",ExecSpec::newNonce(),"id -u",[])); $out=""; $until=microtime(true)+10; while (!$r->finished() && microtime(true)<$until) { $b=$r->read(0.2); if($b!==null) $out.=$b->bytes(); } if (!$r->finished() || $r->exitCode()!==0 || $out!=="0\n") exit(1); $r->close();'
          docker stats --no-stream --format '{{.Name}}: {{.MemUsage}} / {{.PIDs}} processes'
  build:
    needs: [host-bridge-test, compact-stack-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: meridian
            dockerfile: docker/Dockerfile
          - image: meridian-sandbox
            dockerfile: docker/Dockerfile.sandbox
          - image: meridian
            dockerfile: docker/Dockerfile.updater
            variant: updater-
          - image: meridian
            dockerfile: docker/Dockerfile.host
            variant: host-
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/exploid1/${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.variant }}latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ matrix.variant }}main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ matrix.variant }}candidate,enable=${{ github.ref != 'refs/heads/main' }}
            type=sha,format=long,prefix=${{ matrix.variant }}sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MERIDIAN_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.variant }}
